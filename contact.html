<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  
  <!-- Tally Embed Script -->
  <script async src="https://tally.so/widgets/embed.js"></script>

  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Container Card */
    .contact-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 650px;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    /* Header Styling */
    .contact-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .contact-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .contact-header p {
      font-size: 1rem;
      color: #64748b;
    }

    /* Form Container */
    .form-wrapper {
      width: 100%;
    }

    /* Responsive adjustment for small screens */
    @media (max-width: 480px) {
      .contact-container {
        padding: 24px 16px;
      }

      .contact-header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <header class="contact-header">
      <h1>Get in Touch</h1>
      <p>Have a question or feedback? Fill out the form below and we'll get back to you shortly.</p>
    </header>

    <div class="form-wrapper">
      <!-- Tally Form iframe Embed -->
      <iframe 
        data-tally-src="https://tally.so/r/n0Q6eZ?transparentBackground=1" 
        loading="lazy" 
        width="100%" 
        height="350" 
        frameborder="0" 
        marginheight="0" 
        marginwidth="0" 
        title="Contact Us">
      </iframe>
    </div>
  </div>

</body>
</html>
